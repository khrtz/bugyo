name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Linux用のスクリーンショット基準画像を作り直す'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: pnpm check / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  oldest:
    name: ESLint 9.24 と TypeScript 5.8 で lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 対応する一番古い版にそろえる
        run: |
          printf "\noverrides:\n  eslint: 9.24.0\n  '@eslint/js': 9.24.0\n  typescript: 5.8.3\n" >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          test "$(pnpm --filter @bugyo/lint exec eslint --version)" = "v9.24.0"
      - run: pnpm --filter @bugyo/lint --filter @bugyo/lint-react test
      - run: pnpm --filter todo-app --filter node-lib exec tsc --noEmit
      - run: pnpm --filter todo-app --filter node-lib exec eslint .

  npm:
    name: npm で入れたプロジェクト（pnpm なし）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: パッケージを作り、react-vite を npm で入れる
        run: |
          set -eu
          out="$RUNNER_TEMP/npm"
          mkdir -p "$out"
          for p in bugyo @bugyo/lint @bugyo/lint-react; do pnpm --filter "$p" pack --pack-destination "$out"; done
          node packages/bugyo/bin/bugyo.js init "$out/app" --template react-vite
          cd "$out/app"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.devDependencies['bugyo'] = 'file:../bugyo-0.1.0.tgz';
            p.devDependencies['@bugyo/lint'] = 'file:../bugyo-lint-0.1.0.tgz';
            p.devDependencies['@bugyo/lint-react'] = 'file:../bugyo-lint-react-0.1.0.tgz';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: pnpm を PATH から外して、check・test・verify・task done
        working-directory: ${{ runner.temp }}/npm/app
        run: |
          set -eu
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v "$(dirname "$(command -v pnpm)")" | paste -sd: -)"
          if command -v pnpm; then echo "pnpm が残っています"; exit 1; fi
          npm run check
          npm test
          npx bugyo verify --all
          npx bugyo task add "npm での確認" --type ui-flow --feature todos
          npx bugyo task show t-001 | grep -F "npm run check"
          npx bugyo task start t-001 --as ci
          npx bugyo task done t-001

  e2e:
    name: verify（証拠つき）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/todo-app

      - name: verify（todo-app は Playwright、node-lib はコマンド）
        id: e2e
        if: ${{ !inputs.update_snapshots }}
        run: pnpm verify

      - name: この PR で閉じたタスクの証拠を取り直して照合する
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: pnpm recheck --base "origin/${{ github.base_ref }}"

      - name: Linuxの基準画像を作り直す
        if: ${{ inputs.update_snapshots }}
        working-directory: examples/todo-app
        run: pnpm e2e --update-snapshots=all

      - name: 証拠をアップロード
        id: evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            examples/todo-app/artifacts/
            examples/node-lib/artifacts/
          retention-days: 14

      - name: Linuxの基準画像をアップロード
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: examples/todo-app/e2e/__screenshots__/linux/

      - name: PRに証拠のリンクを載せる
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !inputs.update_snapshots }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.e2e.outcome }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- e2e-evidence -->';
            const passed = process.env.OUTCOME === 'success';
            const body = [
              marker,
              `### verify: ${passed ? '✅ PASS' : '❌ FAIL'}`,
              '',
              `- 証拠（動画・スクリーンショット・トレース・HTMLレポート）: ${process.env.ARTIFACT_URL || process.env.RUN_URL}`,
              `- 実行ログ: ${process.env.RUN_URL}`,
              '',
              'レビューではコードの行より先にこの証拠を見てください。トレースは `pnpm exec playwright show-trace trace.zip` で開けます。',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
